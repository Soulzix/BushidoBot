[project]
name = "bubble-byte-discord-bot"
version = "0.1.0"
description = "A robust Discord bot with 24/7 uptime providing comprehensive server management, economy, and interactive features."
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.5.2",
    "email-validator>=2.2.0",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1",
    "twilio>=9.5.0",
]
